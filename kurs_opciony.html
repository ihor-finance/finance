<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Опціони з нуля — інтерактивний курс</title>
<style>
  :root{
    --bg:#0f1220; --card:#1a1f35; --card2:#222945; --text:#e8eaf2; --muted:#9aa3c0;
    --accent:#f5b942; --green:#4ade80; --red:#f87171; --blue:#60a5fa; --border:#2e3760;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.6;}
  .wrap{max-width:820px; margin:0 auto; padding:24px 16px 80px;}
  header{text-align:center; padding:28px 0 12px;}
  header h1{font-size:1.9em; margin-bottom:6px;}
  header p{color:var(--muted);}
  .progress-outer{background:var(--card); border-radius:99px; height:14px; margin:18px 0 6px; overflow:hidden; border:1px solid var(--border);}
  .progress-inner{background:linear-gradient(90deg,var(--accent),#f59e0b); height:100%; width:0%; transition:width .5s; border-radius:99px;}
  .progress-label{font-size:.85em; color:var(--muted); text-align:center; margin-bottom:20px;}
  .mod-card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px 20px; margin-bottom:12px; cursor:pointer; display:flex; align-items:center; gap:14px; transition:transform .15s, border-color .15s;}
  .mod-card:hover:not(.locked){transform:translateY(-2px); border-color:var(--accent);}
  .mod-card.locked{opacity:.45; cursor:not-allowed;}
  .mod-card .num{font-size:1.6em; width:48px; height:48px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--card2); border-radius:12px;}
  .mod-card .info{flex:1;}
  .mod-card .info h3{font-size:1.05em;}
  .mod-card .info p{font-size:.85em; color:var(--muted);}
  .mod-card .status{font-size:1.3em;}
  .badge{display:inline-block; font-size:.75em; padding:2px 10px; border-radius:99px; background:var(--card2); color:var(--muted); margin-top:4px;}
  .badge.done{background:rgba(74,222,128,.15); color:var(--green);}
  .btn{display:inline-block; background:var(--accent); color:#1a1a1a; font-weight:700; border:none; border-radius:12px; padding:13px 26px; font-size:1em; cursor:pointer; transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn.secondary{background:var(--card2); color:var(--text); border:1px solid var(--border);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .topbar .title{font-weight:700;}
  .lesson h2{font-size:1.5em; margin:22px 0 10px; color:var(--accent);}
  .lesson h3{font-size:1.12em; margin:20px 0 8px;}
  .lesson p{margin-bottom:12px;}
  .lesson ul{margin:0 0 12px 22px;}
  .lesson li{margin-bottom:6px;}
  .box{border-radius:14px; padding:14px 18px; margin:14px 0; border:1px solid var(--border); background:var(--card);}
  .box.tip{border-left:4px solid var(--blue);}
  .box.warn{border-left:4px solid var(--red);}
  .box.gold{border-left:4px solid var(--accent);}
  .box.ex{border-left:4px solid var(--green);}
  .box .bt{font-weight:700; margin-bottom:6px; display:block;}
  .formula{background:var(--card2); border-radius:12px; padding:14px; text-align:center; font-weight:700; font-size:1.08em; margin:14px 0; border:1px dashed var(--accent);}
  table{width:100%; border-collapse:collapse; margin:14px 0; font-size:.93em;}
  th,td{border:1px solid var(--border); padding:9px 11px; text-align:left;}
  th{background:var(--card2);}
  .quiz-q{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px;}
  .quiz-q h3{margin-bottom:14px; font-size:1.05em;}
  .opt{display:block; width:100%; text-align:left; background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:12px; padding:12px 16px; margin-bottom:9px; cursor:pointer; font-size:.97em; transition:border-color .1s;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt.correct{border-color:var(--green); background:rgba(74,222,128,.12);}
  .opt.wrong{border-color:var(--red); background:rgba(248,113,113,.12);}
  .expl{margin-top:10px; padding:12px 14px; border-radius:10px; font-size:.92em; display:none;}
  .expl.show{display:block;}
  .expl.ok{background:rgba(74,222,128,.1); border:1px solid var(--green);}
  .expl.no{background:rgba(248,113,113,.1); border:1px solid var(--red);}
  .result-card{text-align:center; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:36px 24px; margin-top:10px;}
  .result-card .big{font-size:3em; margin-bottom:10px;}
  .center{text-align:center; margin-top:22px;}
  .hidden{display:none;}
  .qcount{color:var(--muted); font-size:.85em; margin-bottom:8px;}
  footer{text-align:center; color:var(--muted); font-size:.8em; margin-top:40px;}
  a{color:var(--blue);}
</style>
</head>

id:"m1", emoji:"🧩", title:"Що таке опціон", desc:"Право vs обов'язок, CALL і PUT, премія",
lesson:`
<h2>🧩 Модуль 1. Що таке опціон</h2>
<p><b>Опціон</b> — це фінансовий договір, який дає <b>право (але не обов'язок)</b> купити або продати актив за наперед визначеною ціною до певної дати в майбутньому (дата <b>експірації</b>).</p>
<div class="box ex"><span class="bt">🏠 Проста аналогія</span>
Ти приходиш до продавця квартири й кажеш: «Притримай її для мене на рік» — і платиш за це невелику суму. Якщо квартира виросла в ціні — різницю забираєш собі. Якщо впала — втрачаєш лише те, що заплатив за домовленість.</div>
<h3>Ключові терміни</h3>
<ul>
<li><b>CALL</b> — право <b>купити</b> акції. Купівля CALL = ставка на зростання 📈</li>
<li><b>PUT</b> — право <b>продати</b> акції. Купівля PUT = ставка на падіння 📉</li>
<li><b>Strike Price</b> — ціна, за якою відбудеться купівля/продаж за контрактом</li>
<li><b>Premium (премія)</b> — те, що ти платиш за право. Ці гроші отримує продавець опціону, бо саме він бере на себе ризик</li>
<li><b>Експірація</b> — дата, коли контракт закінчується</li>
</ul>
<div class="box gold"><span class="bt">⚡ Найважливіше правило</span>
1 опціон = контракт на <b>100 акцій</b>. Якщо премія $2 за акцію — контракт коштує $2 × 100 = <b>$200</b>.</div>
<h3>Купівля vs продаж — принципова різниця</h3>
<p>Коли ти <b>купуєш</b> опціон — ти отримуєш <b>ПРАВО</b> і не зобов'язаний ним користуватись.</p>
<p>Коли ти <b>продаєш</b> опціон — ти береш на себе <b>ОБОВ'ЯЗОК</b>:</p>
<ul>
<li>Продав CALL → зобов'язаний <b>продати</b> 100 акцій за Strike, якщо покупець виконає опціон</li>
<li>Продав PUT → зобов'язаний <b>купити</b> 100 акцій за Strike, якщо покупець виконає опціон</li>
</ul>
<div class="box tip"><span class="bt">📌 Опціон — це контракт з обмеженим часом</span>
Тому правильно казати не «акція виросте», а «акція виросте <b>вище певної ціни до певної дати</b>». Важливо бути не просто правим, а правим <b>вчасно</b>.</div>
<h3>Чотири базові позиції</h3>
<table>
<tr><th>Твоє очікування</th><th>Дія</th></tr>
<tr><td>Віриш у швидке зростання</td><td>Купівля CALL 📈</td></tr>
<tr><td>Боковик або невелике зростання (і не проти докупити акцію)</td><td>Продаж PUT 📈</td></tr>
<tr><td>Боковик або невелике падіння</td><td>Продаж CALL 📉</td></tr>
<tr><td>Віриш у швидке падіння</td><td>Купівля PUT 📉</td></tr>
</table>`,
quiz:[
{q:"Що дає покупцеві опціон?", opts:["Обов'язок купити або продати актив","Право (але не обов'язок) купити або продати актив","Гарантований прибуток","Частку в компанії"], a:1, e:"Опціон дає покупцеві саме ПРАВО, а не обов'язок. Обов'язок виникає у ПРОДАВЦЯ опціону."},

{q:"Ти продав CALL. Що це означає?", opts:["Маєш право купити 100 акцій","Зобов'язаний продати 100 акцій за Strike, якщо покупець виконає опціон","Нічого не винен","Зобов'язаний купити 100 акцій"], a:1, e:"Продавець CALL зобов'язаний ПРОДАТИ 100 акцій за Strike. Продаж = обов'язок, купівля = право."},

id:"m2", emoji:"🎯", title:"Статус опціону (The Money)", desc:"ITM, ATM, OTM і що стається з контрактами",
lesson:`
<h2>🎯 Модуль 2. Статус опціону</h2>
<p>«В грошах», «поза грошима», «ATM» — це про співвідношення між <b>Strike Price</b> (ціною за контрактом) і <b>поточною ціною акції</b>. Не плутай Strike з премією — це різні речі!</p>
<h3>Для CALL</h3>
<ul>
<li><b>ATM (At the Money)</b> — Strike дорівнює поточній ціні акції</li>
<li><b>ITM (In the Money)</b> — Strike <b>нижче ⬇</b> поточної ціни. Опціон уже має внутрішню вартість: власник може сказати «виконайте його зараз!»</li>
<li><b>OTM (Out of the Money)</b> — Strike <b>вище ⬆</b> поточної ціни. Щоб з'явилась внутрішня вартість, акція має вирости хоча б до Strike. Поки що покупцю дешевше купити акцію з ринку</li>
</ul>
<h3>Для PUT — усе навпаки</h3>
<ul>
<li><b>ATM</b> — Strike дорівнює поточній ціні</li>
<li><b>ITM</b> — Strike <b>вище ⬆</b> поточної ціни (право продати дорожче за ринок — цінне!)</li>
<li><b>OTM</b> — Strike <b>нижче ⬇</b> поточної ціни. Щоб опціон став цінним, акція має впасти до Strike</li>
</ul>
<div class="box ex"><span class="bt">🧠 Як запам'ятати лінивому</span>
Постав собі питання: «Якби я виконав опціон ЗАРАЗ — я б заробив на різниці цін?» Так → ITM. Ні → OTM. Однаково → ATM.</div>
<h3>📊 Що насправді стається з контрактами</h3>
<table>
<tr><th>Частка</th><th>Доля контрактів</th></tr>
<tr><td><b>55–60%</b></td><td>Закриваються достроково: трейдери фіксують прибуток чи збиток зворотною угодою задовго до експірації</td></tr>
<tr><td><b>30–35%</b></td><td>Згорають без виконання — на дедлайн опинились OTM, виконувати немає сенсу</td></tr>
<tr><td><b>~10%</b></td><td>Виконуються: покупці тримають до кінця і забирають актив або розрахунковий прибуток</td></tr>
</table>
<div class="box warn"><span class="bt">🚨 Висновок</span>
Лише ~10% опціонів доходять до виконання. Більшість трейдерів торгують самим контрактом, а не чекають експірації.</div>`,
quiz:[
{q:"Акція коштує $100. CALL зі Strike $90 — це…", opts:["OTM","ATM","ITM","Неможливо визначити"], a:2, e:"Для CALL: Strike ($90) нижче ціни ($100) → ITM. Право купити за $90 те, що коштує $100 — цінне."},
{q:"Акція коштує $100. PUT зі Strike $90 — це…", opts:["ITM","OTM","ATM","В грошах"], a:1, e:"Для PUT все навпаки: Strike нижче ціни → OTM. Право продати за $90 те, що коштує $100, поки не має внутрішньої вартості."},
{q:"Який відсоток контрактів реально виконується (доходить до поставки активу)?", opts:["Близько 50%","Близько 90%","Близько 10%","Близько 35%"], a:2, e:"Лише ~10%. 55–60% закриваються достроково, 30–35% згорають OTM без виконання."},
{q:"ATM означає, що…", opts:["Strike дорівнює поточній ціні акції","Опціон приносить прибуток","Опціон згорів","Премія дорівнює нулю"], a:0, e:"At the Money — Strike = поточна ціна акції. Умовна «нейтральна зона»."},
{q:"CALL зі Strike $395, акція коштує $390. Чому продавець поки радіє?", opts:["Бо отримає акції","Бо опціон OTM — покупцю дешевше купити акцію з ринку, виконувати немає сенсу","Бо премія зростає","Бо акція точно впаде"], a:1, e:"Опціон OTM: навіщо виконувати право купити за $395, якщо на ринку акція за $390? Продавець тримає премію."}
]},

id:"m3", emoji:"📈", title:"Купівля CALL", desc:"Break Even, сценарії та день експірації",
lesson:`
<h2>📈 Модуль 3. Купівля CALL</h2>
<p>Найпопулярніша стратегія. Приклад: акція Microsoft ($MSFT) коштує <b>$390,83</b>. Ти вважаєш, що до 31 грудня вона виросте до ~$430. Купуєш CALL зі Strike <b>$395</b> за премію <b>$2</b> за акцію.</p>
<div class="box ex"><span class="bt">💵 Скільки платимо</span>
$2 × 100 акцій = <b>$200</b> за контракт (+ комісія брокера).</div>
<h3>Break Even — точка беззбитковості</h3>
<p>Для CALL вона завжди <b>вище Strike</b>, бо крім ціни виконання ти ще заплатив премію:</p>
<div class="formula">Break Even = Strike + Premium<br>$395 + $2 = $397</div>
<div class="box tip"><span class="bt">📌 Нюанс</span>
Опціон можна виконати й нижче Break Even (між $395 і $397), але тоді все одно буде збиток — премія ще не окупилась.</div>
<h3>Три сценарії до експірації</h3>
<ul>
<li>📈 <b>Акція росте</b> → опціон дорожчає. Можна продати в будь-який момент і зафіксувати прибуток — чекати експірації не обов'язково</li>
<li>📉 <b>Акція падає</b> → опціон дешевшає. Можна продати зі збитком</li>
<li>😴 <b>Акція стоїть на місці</b> → опціон усе одно поступово дешевшає через часовий розпад (Theta)</li>
</ul>
<h3>День експірації: три варіанти</h3>
<div class="box ex"><span class="bt">Варіант 1. Ціна вище Break Even ($440)</span>
Внутрішня вартість: $440 − $395 = $45 на акцію → контракт ≈ $4500.<br>Прибуток: $4500 − $200 = <b>+$4300</b> 🎉</div>
<div class="box tip"><span class="bt">Варіант 2. Вище Strike, але нижче Break Even ($396)</span>
Опціон ITM, але після премії ти ≈ в нулі або невеликому мінусі. Якщо віриш у ріст і маєш гроші на 100 акцій — майже єдиний випадок, коли є сенс виконати опціон. Якщо ні — краще продати контракт (збиток ≈ $100).</div>
<div class="box warn"><span class="bt">Варіант 3. Ціна нижче Strike ($394)</span>
Внутрішньої вартості немає — купити з ринку дешевше, ніж за Strike. Опціон згорає (expire worthless). Максимальний збиток заздалегідь відомий: уся сплачена премія = <b>$200</b> + комісії.</div>
<div class="box warn"><span class="bt">🚨 Маржин-кол</span>
Якщо на рахунку не вистачає грошей на виконання, брокер може купити акції в кредит (за маржу), а потім примусово розпродати твої активи. Якщо грошей бракує — <b>краще продати опціон</b>, ніж чекати виконання.</div>`,
quiz:[
{q:"Купив CALL: Strike $395, премія $2. Де Break Even?", opts:["$393","$395","$397","$400"], a:2, e:"Break Even = Strike + Premium = $395 + $2 = $397."},
{q:"Акція на експірацію коштує $440, Strike $395, заплатив $200 за контракт. Прибуток?", opts:["$4500","$4300","$45","$440"], a:1, e:"($440−$395) × 100 = $4500 вартість контракту, мінус $200 премії = $4300."},
{q:"Акція стоїть на місці весь час. Що з вартістю купленого CALL?", opts:["Не змінюється","Росте","Поступово знижується через часовий розпад","Подвоюється"], a:2, e:"Theta працює щодня: навіть без руху акції опціон втрачає часову вартість."},
{q:"Ціна на експірацію нижча за Strike. Твій максимальний збиток?", opts:["Необмежений","Вартість 100 акцій","Уся сплачена премія + комісії","Половина премії"], a:2, e:"У покупця опціону ризик завжди обмежений премією. Опціон просто згорає."},
{q:"Чи обов'язково тримати куплений CALL до експірації?", opts:["Так, це умова контракту","Ні — його можна продати в будь-який момент","Тільки якщо він ITM","Тільки з дозволу продавця"], a:1, e:"Опціон можна продати (Sell to Close) будь-коли — це найчастіший варіант."}
]},
{
id:"m4", emoji:"📉", title:"Купівля PUT", desc:"Ставка на падіння: дзеркальний CALL",
lesson:`
<h2>📉 Модуль 4. Купівля PUT</h2>
<p>Купівля PUT — ставка на падіння акції. Друга за популярністю стратегія. Механіка дзеркальна до CALL.</p>
<div class="box ex"><span class="bt">💵 Приклад</span>
MSFT коштує $390,83, ти чекаєш падіння до ~$360. Купуєш PUT зі Strike <b>$382.5</b> за <b>$1,4</b> за акцію → контракт коштує $1,4 × 100 = <b>$140</b>.</div>
<div class="box tip"><span class="bt">📌 Чому цей PUT дешевший за CALL $395?</span>
Strike $395 набагато ближче до поточної ціни ($390,83), тож імовірність, що CALL опиниться в грошах, вища — за вищий шанс платять більшу премію.</div>
<h3>Сценарії до експірації</h3>
<ul>
<li>📉 <b>Акція падає</b> → PUT дорожчає 📈. Продаєш будь-коли з прибутком</li>
<li>📈 <b>Акція росте</b> → PUT дешевшає 📉. Можна продати раніше і зменшити збиток</li>
<li>😴 <b>Акція на місці</b> → PUT дешевшає через Theta Decay</li>
</ul>
<h3>День експірації</h3>
<div class="box ex"><span class="bt">Варіант 1. Ціна нижче Break Even (акція $370)</span>
Внутрішня вартість: $382.5 − $370 = $12.5 → контракт ≈ $1250.<br>Прибуток: $1250 − $140 = <b>+$1110</b></div>
<div class="box tip"><span class="bt">Варіант 2. Нижче Strike, але вище Break Even ($382)</span>
ITM, але ≈ в нулі. Якщо не плануєш виконувати або бракує коштів — краще продати під час роботи ринку, щоб уникнути маржин-кола.</div>
<div class="box warn"><span class="bt">Варіант 3. Ціна вище Strike</span>
Внутрішньої вартості немає → опціон згорає. Максимальний збиток = сплачена премія ($140).</div>
<div class="formula">Для PUT: Break Even = Strike − Premium<br>$382.5 − $1.4 = $381.1</div>`,
quiz:[
{q:"Купівля PUT — це ставка на…", opts:["Зростання акції","Падіння акції","Боковик","Дивіденди"], a:1, e:"PUT дає право ПРОДАТИ за Strike — заробляє, коли акція падає."},
{q:"Акція впала до $370, PUT Strike $382.5, контракт коштував $140. Прибуток?", opts:["+$1110","+$1250","+$140","−$140"], a:0, e:"($382.5−$370) × 100 = $1250, мінус $140 премії = $1110."},
{q:"Акція виросла і на експірацію вище Strike твого PUT. Результат?", opts:["Необмежений збиток","Збиток = сплачена премія","Прибуток","Брокер компенсує"], a:1, e:"Опціон згорає без вартості. Покупець втрачає лише премію."},
{q:"PUT зі Strike $382.5 коштує дешевше, ніж CALL зі Strike $395 (акція $390,83). Чому?", opts:["PUT завжди дешевші","Strike CALL ближче до поточної ціни — шанс опинитись у грошах вищий","Помилка брокера","Через дивіденди"], a:1, e:"Що ближчий Strike до ціни, то вищий шанс виграшу — і дорожчий опціон."}
]},

id:"m5", emoji:"🔥", title:"Продаж Naked CALL і PUT", desc:"Де ховається необмежений ризик",
lesson:`
<h2>🔥 Модуль 5. Продаж «голих» опціонів</h2>
<p>Тепер зворотна сторона. Ти вважаєш, що MSFT залишиться на місці або трохи знизиться → замість купівлі можна <b>продати CALL</b>. Премія (наприклад, $180) одразу надходить на рахунок.</p>
<div class="box tip"><span class="bt">📌 Chance of Profit</span>
При продажу замість Break Even термінал зазвичай показує Chance of Profit — розрахункову ймовірність, що угода буде прибутковою (на основі моделі ціноутворення і греків).</div>
<h3>Сценарії продавця CALL</h3>
<ul>
<li>📈 <b>Акція росте</b> — погано! Проданий опціон дорожчає. Щоб закрити позицію раніше, доведеться викупити його дорожче (<b>Buy to Close</b>) → збиток</li>
<li>😴📉 <b>На місці або падає</b> — опціон дешевшає. Викуповуєш дешевше або чекаєш, поки згорить — премія твоя</li>
</ul>
<h3>🚨 Чому Naked CALL — одна з найризикованіших стратегій</h3>
<div class="box warn"><span class="bt">Приклад катастрофи</span>
Продав CALL Strike $395, отримав $180. MSFT за день злетіла до $440. Покупець виконує контракт: ти зобов'язаний продати 100 акцій по $395, але їх у тебе НЕМАЄ.<br><br>
Купуєш з ринку: $440 × 100 = $44 000<br>
Продаєш покупцю: $395 × 100 = $39 500<br>
Збиток: $4500 − $180 премії = <b>−$4320</b><br><br>
Акція по $450? Збиток уже −$5320. Кожні +$10 ціни ≈ ще −$1000 на контракт.</div>
<div class="box gold"><span class="bt">⚡ Запам'ятай</span>
Збиток продавця Naked CALL <b>практично необмежений</b> — акція теоретично може рости нескінченно.</div>
<h3>Продаж Naked PUT</h3>
<p>Аналогічно, але дзеркально: продаєш PUT, якщо не чекаєш сильного падіння. Отримуєш премію одразу (напр., $255 за контракт зі Strike $387.5).</p>
<ul>
<li>📉 Акція падає → проданий PUT дорожчає → збиток</li>
<li>📈😴 Росте або на місці → PUT дешевшає → викуповуєш дешевше або даєш згоріти</li>
</ul>
<div class="box tip"><span class="bt">📌 Ключова відмінність від Naked CALL</span>
Максимальний збиток продавця PUT <b>обмежений</b> (хоч і болючий): акція не може впасти нижче $0. А от вгору стелі немає — тому Naked CALL небезпечніший.</div>`,
quiz:[
{q:"Що отримує продавець опціону одразу після продажу?", opts:["Акції","Премію на рахунок","Право купити акції","Нічого"], a:1, e:"Премія миттєво надходить на рахунок продавця — це його плата за прийнятий ризик."},
{q:"Продав Naked CALL Strike $395 (премія $180). Акція виросла до $440 і опціон виконали. Твій результат?", opts:["+$180","−$4500","−$4320","−$180"], a:2, e:"Купуєш по $440, продаєш по $395: −$4500, плюс отримана премія $180 = −$4320."},
{q:"Чому збиток Naked CALL вважається практично необмеженим?", opts:["Через комісії","Бо акція може рости нескінченно","Бо премія маленька","Бо брокер додає відсотки"], a:1, e:"Стелі росту акції немає. У Naked PUT збиток обмежений, бо ціна не падає нижче $0."},
{q:"Як продавець закриває позицію достроково?", opts:["Sell to Close","Buy to Close — викуповує той самий опціон назад","Дзвонить покупцю","Ніяк, тільки чекати"], a:1, e:"Продавець робить зворотну угоду: викуповує проданий опціон (Buy to Close)."},
{q:"Найкращий сценарій для продавця опціону?", opts:["Опціон згорає без вартості — вся премія залишається","Акція летить у бік покупця","Опціон виконують","Волатильність вибухає"], a:0, e:"Якщо опціон на експірацію OTM — він згорає, а продавець залишає собі всю премію."}

id:"m6", emoji:"💎", title:"З чого складається ціна опціону", desc:"Intrinsic + Extrinsic, Theta, IV та IV Crush",
lesson:`
<h2>💎 Модуль 6. З чого складається ціна опціону</h2>
<p>Ціна будь-якого опціону = <b>Intrinsic Value</b> (внутрішня вартість) + <b>Extrinsic Value</b> (зовнішня, вартість часу і шансу). Розуміння цього — одна з найважливіших речей в опціонах.</p>
<h3>Intrinsic Value — внутрішня вартість</h3>
<p>Скільки опціон вартий, якщо виконати його <b>прямо зараз</b>.</p>
<div class="formula">Для CALL: Intrinsic = Ціна акції − Strike (якщо результат додатний)<br>OTM-опціон → Intrinsic = $0</div>
<h3>Extrinsic Value — вартість часу і очікувань</h3>
<div class="box ex"><span class="bt">🎲 Аналогія з кубиком</span>
Я даю тобі кубик на 6 граней і плачу ×6 за вгадане число. Довгостроково заробити тут не можна — Intrinsic Value такої угоди $0. Але сам ШАНС виграти вартий грошей. Плата за шанс — це і є Extrinsic Value.</div>
<div class="formula">Extrinsic = Ціна опціону − Intrinsic</div>
<p>Саме ця частина <b>поступово випаровується</b> з наближенням експірації. На неї найбільше впливають два фактори: <b>Theta</b> та <b>Implied Volatility</b>.</p>
<h3>⏳ Theta — часовий розпад</h3>
<p>Що більше часу до експірації — то дорожчий опціон: у акції більше шансів зробити сильний рух. Але щодня цього часу меншає, і процес <b>прискорюється</b> ближче до кінця — особливо приблизно за 45 днів до експірації.</p>
<div class="box ex"><span class="bt">🎰 Аналогія з казино</span>
Казино зачиняється о 00:00, а на годиннику вже 23:30. Якщо ти ще не виграв — за пів години «навряд чи виграєш». Шанс на перемогу тане з кожною хвилиною.</div>
<h3>🌊 Implied Volatility (IV)</h3>
<p>IV показує, наскільки сильних рухів ринок очікує від акції. Що вища IV — то дорожчі опціони.</p>
<ul>
<li>Стабільні компанії (Coca-Cola) — низька IV, дешеві опціони</li>
<li>Швидкі й різкі (Tesla, Coinbase) — висока IV, дорогі опціони</li>
</ul>
<p>IV різна не лише в різних компаній, а й у різних опціонів однієї акції: залежить від дати експірації, статусу ITM/OTM та очікуваних подій (звіти, IPO, нестабільність).</p>
<h3>💥 IV Crush</h3>
<div class="box warn"><span class="bt">🚨 Пастка перед звітами</span>
Перед квартальним звітом IV висока — ринок чекає сильного руху. Звіт виходить → невизначеність зникає → IV різко падає → опціон дешевшає, <b>навіть якщо акція майже не рухалась</b>. Можна вгадати напрямок і все одно втратити гроші!</div>
<div class="box gold"><span class="bt">⚡ Правило</span>
Вигідніше <b>купувати опціони на низькій IV</b>, а <b>продавати на високій</b>.</div>`,
quiz:[
{q:"Акція коштує $400, CALL Strike $390 коштує $15. Яка Intrinsic Value?", opts:["$15","$10","$5","$0"], a:1, e:"Intrinsic = $400 − $390 = $10. Решта $5 — це Extrinsic (час і шанс)."},
{q:"Яка Intrinsic Value у OTM-опціону?", opts:["Дорівнює премії","Від'ємна","$0","Дорівнює Strike"], a:2, e:"OTM-опціон не має сенсу виконувати зараз → внутрішня вартість нульова. Вся його ціна — Extrinsic."},
{q:"Що відбувається з часовою вартістю опціону з наближенням експірації?", opts:["Зростає","Зникає, і процес прискорюється (особливо за ~45 днів)","Не змінюється","Стрибає випадково"], a:1, e:"Theta Decay прискорюється ближче до кінця — як шанси виграти в казино за 30 хв до закриття."},
{q:"Що таке IV Crush?", opts:["Різке зростання ціни акції","Різке падіння IV після події (звіту), яке обвалює ціну опціону навіть без руху акції","Банкрутство брокера","Виконання опціону"], a:1, e:"Після звіту невизначеність зникає, IV падає — і опціон дешевшає, навіть якщо ти вгадав напрямок."},
{q:"Коли вигідніше купувати опціони?", opts:["На високій IV","Перед самим звітом","На низькій IV","В день експірації"], a:2, e:"Купуй дешевий шанс (низька IV), продавай дорогий (висока IV)."}
]},

id:"m7", emoji:"🖥️", title:"Термінал і греки", desc:"Bid/Ask, Open Interest, Delta, Gamma, Theta, Vega",
lesson:`
<h2>🖥️ Модуль 7. Параметри в терміналі та греки</h2>
<h3>Основні параметри опціону</h3>
<table>
<tr><th>Параметр</th><th>Що означає</th></tr>
<tr><td><b>Bid</b></td><td>Найвища ціна, яку покупці готові заплатити. <b>Ми за нею продаємо</b></td></tr>
<tr><td><b>Ask</b></td><td>Найнижча ціна, за якою продавці готові продати. <b>Ми за нею купуємо</b></td></tr>
<tr><td><b>Mark</b></td><td>Розрахункова ціна ≈ посередині між Bid і Ask</td></tr>
<tr><td><b>Volume</b></td><td>Скільки контрактів проторговано за день. Вищий Volume = вища ліквідність</td></tr>
<tr><td><b>Open Interest</b></td><td>Кількість усіх відкритих контрактів, які ще не закриті/не виконані</td></tr>
<tr><td><b>Bid-Ask Spread</b></td><td>Різниця між Bid і Ask</td></tr>
</table>
<div class="box warn"><span class="bt">🚨 Чому Open Interest критично важливий</span>
Якщо OI маленький — може не знайтись охочих, коли захочеш закрити позицію. Швидко вийти за справедливою ціною не вдасться. Саме через брак OI у березні 2026 закрили біржу опціонів Nasdaq Sweden — інвестори не змогли продати й чекали розрахунку.</div>
<div class="box tip"><span class="bt">📌 Спред і проковзування (Slippage)</span>
Вузький спред → легко торгувати за справедливою ціною. Широкий → втрачаєш гроші вже на вході та виході. Під час різких рухів спред швидко розширюється, і ордер може виконатись за гіршою ціною — це і є проковзування. Маркет-мейкери люблять широкий спред: мільйони угод × $0,10 = серйозний прибуток.</div>
<h3>🏛️ Греки — датчики опціону</h3>
<table>
<tr><th>Грек</th><th>Показує</th></tr>
<tr><td><b>Delta</b></td><td>На скільки зміниться ціна опціону при русі акції на $1. Для CALL додатна, для PUT від'ємна. Не постійна: що глибше ITM, то ближча до 1</td></tr>
<tr><td><b>Gamma</b></td><td>На скільки зміниться сама Delta при русі акції на $1. Найвища біля Strike — там ціна опціону змінюється найшвидше</td></tr>
<tr><td><b>Theta</b></td><td>Скільки вартості опціон втрачає за день через час. Theta −0,06 ≈ −$6 за контракт щодня. Головний ворог покупця</td></tr>
<tr><td><b>Vega</b></td><td>Чутливість до зміни IV. IV росте → і CALL, і PUT дорожчають</td></tr>
<tr><td><b>Rho</b></td><td>Чутливість до процентних ставок. Найменш важливий — його майже ніхто не використовує</td></tr>
</table>
<div class="box ex"><span class="bt">⚡ Gamma Squeeze</span>
Стрімкий ріст акції → росте Gamma й Delta → маркет-мейкери та алгоритми змушені докуповувати акції → це розганяє ціну ще більше. Лавиноподібний зліт.</div>`,
quiz:[
{q:"За якою ціною ти КУПУЄШ опціон?", opts:["Bid","Ask","Mark","Previous Close"], a:1, e:"Купуємо за Ask (найнижча ціна продавців), продаємо за Bid."},
{q:"Що показує Open Interest?", opts:["Обсяг торгів за день","Кількість усіх відкритих контрактів, ще не закритих чи виконаних","Відсоток прибуткових угод","Ставку ФРС"], a:1, e:"OI — усі відкриті контракти. Малий OI = ризик, що не зможеш вийти з позиції за справедливою ціною."},
{q:"Delta CALL-опціону = 0,17. Акція виросла на $1. Що з ціною опціону?", opts:["+$1 за акцію","+$0,17 за акцію","−$0,17 за акцію","Без змін"], a:1, e:"Delta показує зміну ціни опціону на $1 руху акції: +$0,17 за акцію (≈ +$17 на контракт)."},

]},

id:"m8", emoji:"🛡️", title:"Covered CALL, Cost Basis і CSP", desc:"Як продавати опціони безпечно та фармити премії",
lesson:`
<h2>🛡️ Модуль 8. Безпечний продаж: Covered CALL і Cash Secured PUT</h2>
<h3>Credit і Debit</h3>
<ul>
<li><b>Credit</b> — гроші НАДХОДЯТЬ на рахунок (коли продаєш опціон). Не плутати з кредитом-позикою!</li>
<li><b>Debit</b> — гроші СПИСУЮТЬСЯ (коли купуєш опціон)</li>
</ul>
<h3>Covered CALL — покритий CALL</h3>
<p>У тебе вже є 100 акцій MSFT (куплені по $350). Ти не плануєш продавати, але вважаєш, що вище $400 акція до експірації не піде. Продаєш CALL Strike $400 → отримуєш премію $905.</p>
<div class="box ex"><span class="bt">✅ Найкращий сценарій</span>
На експірацію акція $399 — до Strike не дійшла. Опціон згорає, акції твої, премія твоя. Одразу продаєш наступний CALL (напр., Strike $420) — і знову премія. Так можна фармити дохід постійно.</div>
<div class="box tip"><span class="bt">😐 «Найгірший» сценарій</span>
Акція виросла до $405, опціон виконали → продаєш акції по $400.<br>Прибуток: ($400−$350)×100 = $5000 + премія $905 = <b>$5905</b>.<br>Так, без CALL заробив би трохи більше (продавши по $405), але різниця лише ~$500. Головне: акції ВЖЕ в тебе — не треба купувати їх за ринковою ціною, як у Naked CALL. Саме тому Covered CALL значно безпечніший.</div>
<h3>💰 Poor Man's Covered CALL (PMCC)</h3>
<p>Та сама ідея, але без дорогих 100 акцій. Професійна назва — Long Diagonal Debit Spread:</p>
<ul>
<li><b>Крок 1:</b> купуєш довгостроковий CALL глибоко ITM (Delta ≈ 0.80+) — так званий <b>LEAPS</b> (термін 6 міс – 2 роки). Він «симулює» акції, але коштує на 70–80% дешевше</li>
<li><b>Крок 2:</b> продаєш короткостроковий OTM CALL на 30–45 днів → премія в кишеню. Щомісяця повторюєш, поступово окуповуючи LEAPS</li>
</ul>
<div class="box warn"><span class="bt">🚨 Ризики PMCC</span>
Обвал ринку → LEAPS стрімко втрачає вартість (можеш втратити весь дебет). Різкий зліт вище проданого Strike → можуть примусити виконати зобов'язання зі збитком.</div>
<h3>📉 Cost Basis — собівартість позиції</h3>
<p>Фактична собівартість акцій = ціна купівлі мінус усі надходження (премії від Covered CALL, дивіденди тощо).</p>
<div class="box ex"><span class="bt">Приклад</span>
Купив 100 акцій $HOOD по $100. Продав Covered CALL за $1, викупив за $0,50 → заробив $0,50. Собівартість: $99,50. Продав ще один CALL за $1, він згорів → собівартість $98,50. Кожна премія знижує вхід у позицію.</div>
<div class="box gold"><span class="bt">⚡ Головне правило Cost Basis</span>
Strike проданого Covered CALL має бути <b>вище твоєї собівартості</b>. Приклад: собівартість $89, акція впала до $80, ти продав CALL Strike $85. Якщо його виконають — продаси по $85 при собівартості $89 = зафіксуєш збиток, попри всі премії.</div>
<h3>🏦 Cash Secured PUT (CSP)</h3>
<p>Продаж PUT, коли на рахунку <b>вже лежить сума на купівлю акцій</b>, якщо опціон виконають. Для CALL треба мати акції, для PUT — гроші.</p>

Продаєш PUT Strike $390 → одразу $365 премії. На рахунку має бути $390 × 100 = $39 000 як забезпечення.<br><br>
📈 Акція росте → PUT дешевшає → викуповуєш дешевше, прибуток.<br>
😴 На місці → Theta працює на тебе.<br>
📉 Падає нижче $390 → купуєш акції по $390. Але якщо ти й так хотів їх купити за цією ціною — ти просто увійшов у позицію, ще й отримавши премію за очікування! А далі можна продавати на ці акції Covered CALL.</div>
<div class="box tip"><span class="bt">📌 Правила CSP</span>
Продавай CSP лише на компанії, які: готовий тримати довгостроково; щодо яких маєш позитивний погляд; які влаштовують тебе навіть при поставці акцій. CSP — це «страховий бізнес»: береш на себе ризик падіння за премію.</div>`,

<p>Одночасна <b>купівля і продаж опціонів одного типу</b> (обидва CALL або обидва PUT) з однією датою експірації, але різними Strike. За зниження ризику платиш обмеженням максимального прибутку.</p>

    <div class="status">${examPassed?"🎓":(examUnlocked?"▶️":"🔒")}</div></div>`;
  if(examPassed){
    html += `<div class="result-card"><div class="big">🎓</div><h2>Вітаю, курс завершено!</h2><p style="margin-top:8px">Ти знаєш базу опціонів краще за більшість новачків. Пам'ятай: розуміння ризику — це те, що відрізняє успішного інвестора від новачка.</p></div>`;
  }
  html += `<div class="center"><button class="btn secondary" onclick="resetAll()">🔄 Скинути прогрес</button></div>`;
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function openLesson(i){
  const m = MODULES[i];
  app.innerHTML = `<div class="topbar"><button class="btn secondary" onclick="renderHome()">← Меню</button><div class="title">Модуль ${i+1} з ${MODULES.length}</div></div>
  <div class="lesson">${m.lesson}</div>
  <div class="center"><button class="btn" onclick="openQuiz(${i})">📝 Пройти тест (${m.quiz.length} питань)</button></div>`;
  window.scrollTo(0,0);
}

let quizCtx = null;
function openQuiz(i){
  quizCtx = {modIdx:i, questions:MODULES[i].quiz, idx:0, correct:0, isExam:false, title:`Тест · Модуль ${i+1}`};
  renderQuestion();
}
function openExam(){
  quizCtx = {modIdx:-1, questions:FINAL_EXAM, idx:0, correct:0, isExam:true, title:"🏆 Фінальний іспит"};
  renderQuestion();
}

function renderQuestion(){
  const c = quizCtx, q = c.questions[c.idx];
  let opts = q.opts.map((o,j)=>`<button class="opt" data-j="${j}" onclick="answer(${j})">${o}</button>`).join("");
  app.innerHTML = `<div class="topbar"><button class="btn secondary" onclick="renderHome()">← Меню</button><div class="title">${c.title}</div></div>
  <div class="qcount">Питання ${c.idx+1} з ${c.questions.length} • Правильних: ${c.correct}</div>
  <div class="quiz-q"><h3>${q.q}</h3>${opts}
  <div class="expl" id="expl"></div>
  <div class="center hidden" id="nextWrap"><button class="btn" onclick="nextQ()">${c.idx+1<c.questions.length?"Далі →":"Результат 🏁"}</button></div></div>`;
  window.scrollTo(0,0);
}

function answer(j){
  const c = quizCtx, q = c.questions[c.idx];
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled = true;
    const bj = +b.dataset.j;
    if(bj===q.a) b.classList.add("correct");
    else if(bj===j) b.classList.add("wrong");
  });
  const ok = j===q.a;
  if(ok) c.correct++;
  const ex = document.getElementById("expl");
  ex.className = "expl show " + (ok?"ok":"no");
  ex.innerHTML = (ok?"✅ <b>Правильно!</b> ":"❌ <b>Не зовсім.</b> ") + q.e;
  document.getElementById("nextWrap").classList.remove("hidden");
}

function nextQ(){
  const c = quizCtx;
  c.idx++;
  if(c.idx < c.questions.length){ renderQuestion(); return; }
  const score = Math.round(c.correct/c.questions.length*100);
  const pass = score >= PASS;
  if(c.isExam){ state.exam = Math.max(state.exam||0, score); }
  else if(pass){ state.passed[MODULES[c.modIdx].id] = score; }
  store.save(state);
  let btns;
  if(pass){
    btns = `<button class="btn" onclick="renderHome()">Продовжити →</button>`;
  } else {
    btns = `<button class="btn" onclick="${c.isExam?"openExam()":`openQuiz(${c.modIdx})`}">🔁 Спробувати ще раз</button>
    ${c.isExam?"":`<button class="btn secondary" onclick="openLesson(${c.modIdx})" style="margin-left:8px">📖 Перечитати урок</button>`}`;
  }
  app.innerHTML = `<div class="result-card">
    <div class="big">${pass?(score===100?"🌟":"🎉"):"😅"}</div>
    <h2>${score}% (${c.correct} з ${c.questions.length})</h2>
    <p style="margin:10px 0 20px">${pass?(c.isExam?"Іспит складено! Ти офіційно розібрався в опціонах.":"Модуль складено! Наступний розблоковано."):`Потрібно ${PASS}%+. Нічого страшного — перечитай урок і спробуй ще раз.`}</p>
    ${btns}</div>`;
  window.scrollTo(0,0);
}

function resetAll(){
  if(confirm("Точно скинути весь прогрес?")){
    state = {passed:{}, exam:null};
    store.save(state);
    renderHome();
  }
}
renderHome();
</script>
</body>
</html>
